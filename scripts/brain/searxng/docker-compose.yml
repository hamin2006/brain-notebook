# Self-hosted SearXNG for the agent's web_search tool (no API key, no per-search cost).
# Listens on localhost only; the API reaches it at SEARXNG_URL (default http://127.0.0.1:8888).
#
#   cd scripts/brain/searxng
#   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" > .env   # once; .env is git-ignored
#   docker compose up -d
services:
  searxng:
    image: searxng/searxng:latest
    restart: always
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
